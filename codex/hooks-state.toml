# Ponytail（ponytail@ponytail）の Codex hook 信頼エントリ。
# 出所: ローカルで `codex` → `/hooks` から人間が信頼した結果の複製（~/.codex/config.toml、2026-09-05）。
# ハッシュは hook 定義内容のみから計算されパス非依存（cloud/README.md 5(c)）。
# hooks/bootstrap.sh がクラウドの ~/.codex/config.toml に未登録なら丸ごと追記する。
# Ponytail が hook 定義を変えた場合は値が変わる（Codex 上で「Modified」表示）→ ローカルで再信頼し、この 3 件を差し替える。

