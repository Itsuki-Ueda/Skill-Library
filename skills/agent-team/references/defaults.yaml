# /agent-team のグローバル既定値（正本）。全プロジェクト共通。
# CLIのモデル値はyaml、Agentのモデル値はエージェント定義（~/.agents/agents/*.md）が正本。
# 既存の値を維持。設定変更時だけ参照経路を確認し、毎dispatchの照合・人間確認を追加しない。
# プロジェクト側 .agents/config/team.yaml に同じキーがあればそちらが優先（差分上書き）。
# codex系で model/effort が未定義に落ちた場合の最終フォールバックは codex-protocol.md §1。
# モデル・effort を選んだ実測の根拠（sol と luna の比較・luna の重み）: ~/.agents/docs/codex-model-comparison.md

routing:
  # 実装系（原型記事のPareto配分。slug変更時はここだけ直す）
  express:     { cli: codex, model: gpt-6-luna, effort: xhigh }
  worker:      { cli: codex, model: gpt-6.1-sol, effort: medium, parallel_max: 5 }
  hard-worker: { agent: coding-agent }               # 難度レーン。モデル・effortはエージェント定義に従う(Opus 5.5 / high)
  cc-worker:   { agent: coding-agent }               # モデル・effortはエージェント定義に従う(Opus 5.5 / high)
  # 調査・レビュー系
  # 調査の既定はCodex（team-researcher名指し）。CCへ切り替えるのは
  # (a)人間がCC委託を指示した場合 (b)Codexのusage limitで使えない場合 のみ。
  research:    { cli: codex, model: gpt-6-luna, effort: max, parallel_max: 6 }
  # 重要領域の重ね調査専用（dispatch「調査結果の採用」）。見落としの相関を下げる。試用中(2026-09-23〜)
  research-overlap: { agent: researcher, model: sonnet }   # effortはエージェント定義に従う(medium)
  cc-research: { agent: researcher, model: sonnet, parallel_max: 6 }  # フォールバック。列挙も含め全種別 Sonnet（2026-10-08）
  review:       { agent: reviewer }                  # Opus 5.5 / medium CCレビュアー(直接実行モードのフォールバック)
  # プラン曖昧さ測定プローブ（[3]初回ラウンド。正本=team-plan-probeスキル。測定器なので下位モデル固定）
  plan-probe:       { agent: plan-probe }                             # CC Orchestrator用(Haiku 5.5 / effort low)
  # Codexレビュアーの正本。gate1(Codex実装分の独立レビュー)とcc-worker実装分のレビューの両方で使う。
  codex-review: { cli: codex, model: gpt-6.1-sol, effort: medium }

  # 執行系（[4]〜[6]の進行管理をミッション単位で担うexecutorサブエージェント。親のコンテキスト節約）
  # Orchestratorが Fable / Opus のときに使う（Opus は2026-10-05から試行）。それ以外は委譲せず直接実行
  executor:    { agent: executor }                 # モデル・effortはエージェント定義に従う(Opus 5.5 / high)

limits:
  fix_rounds_express: 2
  fix_rounds_task: 3     # タスクのコードレビュー往復。数え方と超過時の扱いは dispatch「再レビュー・上限」
  fix_rounds_plan: 3     # [3]分解文書のプランレビュー往復。超過は人間へエスカレーション
